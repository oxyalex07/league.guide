<svg xmlns="http://www.w3.org/2000/svg" width="360" height="458" viewBox="0 0 360 458" role="img" aria-labelledby="title desc"><title id="title">Peeling</title><desc id="desc">Illustrative decision sequence; not to scale.</desc><style>.bg{fill:#f4f6fb}.card{fill:#fff;stroke:#d9e0ec}.num{fill:#224fc5}.numt{fill:#fff;font-weight:800}.lab{fill:#224fc5;font-weight:800;letter-spacing:.06em}.t{fill:#182a40}.lead{fill:#182a40;font-weight:650}.muted{fill:#5b6b80}.arrow{stroke:#224fc5;fill:none}text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media(prefers-color-scheme:dark){.bg{fill:#171717}.card{fill:#202020;stroke:#3a3a3a}.num{fill:#9abaff}.numt{fill:#111}.lab{fill:#9abaff}.t,.lead{fill:#ededed}.muted{fill:#a8a8a8}.arrow{stroke:#9abaff}}</style><rect class="bg" width="360" height="458" rx="16"/><text x="16" y="34" class="lead" style="font-size:18px">Peeling</text><rect class="card" x="16" y="56" width="328" height="102" rx="14"/><circle class="num" cx="42" cy="84" r="13"/><text class="numt" x="42" y="89" text-anchor="middle" style="font-size:13px">1</text><text class="lab" x="64" y="89" style="font-size:12px">IDENTIFY</text><text class="lead" x="32" y="120" style="font-size:14px">Side threat → vulnerable ally</text><text class="t" x="32" y="141" style="font-size:14px">Watch the dangerous approach.</text><path class="arrow" d="M180.0 163 v14 m-6 -6 l6 6 l6 -6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect class="card" x="16" y="184" width="328" height="102" rx="14"/><circle class="num" cx="42" cy="212" r="13"/><text class="numt" x="42" y="217" text-anchor="middle" style="font-size:13px">2</text><text class="lab" x="64" y="217" style="font-size:12px">DISRUPT</text><text class="t" x="32" y="248" style="font-size:14px">Protector uses a ready tool Create</text><text class="t" x="32" y="269" style="font-size:14px">space for the ally.</text><path class="arrow" d="M180.0 291 v14 m-6 -6 l6 6 l6 -6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect class="card" x="16" y="312" width="328" height="102" rx="14"/><circle class="num" cx="42" cy="340" r="13"/><text class="numt" x="42" y="345" text-anchor="middle" style="font-size:13px">3</text><text class="lab" x="64" y="345" style="font-size:12px">FOLLOW</text><text class="t" x="32" y="376" style="font-size:14px">Ally moves toward safety Stay able</text><text class="t" x="32" y="397" style="font-size:14px">to answer next threat.</text><text class="muted" x="16" y="448" style="font-size:11px">Illustrative · not to scale</text></svg>