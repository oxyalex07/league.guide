<svg xmlns="http://www.w3.org/2000/svg" width="680" height="884" viewBox="0 0 680 884" role="img" aria-labelledby="title desc"><title id="title">MA10 — Check before committing</title><desc id="desc">Dragon is available. Check urgency, participants, wave duties and access: the carry is returning, mid is defending and one approach is unchecked. Wait at a safe entrance and reassess; imminent game-ending risk may change the choice.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#1749bd"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#fff"/><path d="M0 8L8 0" stroke="#dce2ed"/></pattern></defs><rect width="100%" height="100%" fill="#f5f7fb"/><g font-family="Arial, sans-serif"><text x="20" y="28" fill="#172b4d" font-size="22" font-weight="700">Check before committing</text><text x="20" y="58.8" fill="#405574" font-size="17" font-weight="400">Hypothetical · not to scale</text><rect x="20" y="94.6" width="640" height="115.79999999999998" rx="9" fill="#ffffff" stroke="#78869c"/><text x="34" y="120.6" fill="#1749bd" font-size="18" font-weight="700">1 · Urgency</text><text x="34" y="148.79999999999998" fill="#172b4d" font-size="17" font-weight="400">What does waiting or conceding cost? Dragon being available is</text><text x="34" y="172.59999999999997" fill="#172b4d" font-size="17" font-weight="400">not enough.</text><rect x="20" y="238.39999999999998" width="640" height="115.80000000000001" rx="9" fill="#ffffff" stroke="#78869c"/><text x="34" y="264.4" fill="#1749bd" font-size="18" font-weight="700">2 · Participants</text><text x="34" y="292.59999999999997" fill="#172b4d" font-size="17" font-weight="400">Carry is returning from base. Check actual arrivals and usable</text><text x="34" y="316.4" fill="#172b4d" font-size="17" font-weight="400">resources.</text><rect x="20" y="382.2" width="640" height="115.80000000000001" rx="9" fill="#ffffff" stroke="#78869c"/><text x="34" y="408.2" fill="#1749bd" font-size="18" font-weight="700">3 · Wave duties</text><text x="34" y="436.4" fill="#172b4d" font-size="17" font-weight="400">Mid is defending a wave; do not count that player as already</text><text x="34" y="460.2" fill="#172b4d" font-size="17" font-weight="400">present.</text><rect x="20" y="526.0" width="640" height="115.79999999999995" rx="9" fill="#ffffff" stroke="#78869c"/><text x="34" y="552.0" fill="#1749bd" font-size="18" font-weight="700">4 · Access</text><text x="34" y="580.2" fill="#172b4d" font-size="17" font-weight="400">One approach is unchecked. Keep an exit; do not force a blind</text><text x="34" y="604.0" fill="#172b4d" font-size="17" font-weight="400">late ward.</text><rect x="20" y="669.8" width="640" height="115.79999999999995" rx="9" fill="#ffffff" stroke="#78869c"/><text x="34" y="695.8" fill="#1749bd" font-size="18" font-weight="700">Example choice · WAIT</text><text x="34" y="724.0" fill="#172b4d" font-size="17" font-weight="400">Wait at a safe entrance, then reassess all four checks when cues</text><text x="34" y="747.8" fill="#172b4d" font-size="17" font-weight="400">change.</text><text x="20" y="820.5999999999999" fill="#405574" font-size="17" font-weight="400">Imminent game-ending risk can change the choice. This decision aid</text><text x="20" y="844.3999999999999" fill="#405574" font-size="17" font-weight="400">is teaching synthesis, not a guaranteed take.</text></g><style>@media(prefers-color-scheme:dark){text{fill:#ededed}.label{fill:#9abaff}[fill="#f5f7fb"]{fill:#191919}[stroke="#f5f7fb"]{stroke:#191919}[fill="#ffffff"]{fill:#222222}[stroke="#ffffff"]{stroke:#222222}[fill="#fff"]{fill:#222222}[stroke="#fff"]{stroke:#222222}[fill="white"]{fill:#222222}[stroke="white"]{stroke:#222222}[fill="#dee5f3"]{fill:#2c2c2c}[stroke="#dee5f3"]{stroke:#2c2c2c}[fill="#172b4d"]{fill:#ededed}[stroke="#172b4d"]{stroke:#ededed}[fill="#405574"]{fill:#b5b5b5}[stroke="#405574"]{stroke:#b5b5b5}[fill="#1749bd"]{fill:#9abaff}[stroke="#1749bd"]{stroke:#9abaff}[fill="#dce2ed"]{fill:#424242}[stroke="#dce2ed"]{stroke:#424242}[fill="#78869c"]{fill:#777777}[stroke="#78869c"]{stroke:#777777}}</style></svg>