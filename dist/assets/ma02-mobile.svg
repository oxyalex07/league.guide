<svg xmlns="http://www.w3.org/2000/svg" width="340" height="673" viewBox="0 0 340 673" role="img" aria-labelledby="title desc"><title id="title">MA02 — A changed threat changes recall</title><desc id="desc">With enough resources, a jungler visible elsewhere and a feasible crash, finish the crash then leave. When nearly dead and clearing would spend the escape tool while the jungler is missing, leave with an imperfect wave.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#1749bd"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#fff"/><path d="M0 8L8 0" stroke="#dce2ed"/></pattern></defs><rect width="100%" height="100%" fill="#f5f7fb"/><g font-family="Arial, sans-serif"><text x="20" y="28" fill="#172b4d" font-size="22" font-weight="700">A changed threat changes</text><text x="20" y="58.8" fill="#172b4d" font-size="22" font-weight="700">recall</text><text x="20" y="89.6" fill="#405574" font-size="17" font-weight="400">Hypothetical · not to scale</text><rect x="20" y="125.39999999999999" width="300" height="187.20000000000005" rx="9" fill="#ffffff" stroke="#78869c"/><text x="34" y="151.39999999999998" fill="#1749bd" font-size="18" font-weight="700">A · Crash is feasible</text><text x="34" y="179.59999999999997" fill="#172b4d" font-size="17" font-weight="400">Enough resources; jungler</text><text x="34" y="203.39999999999998" fill="#172b4d" font-size="17" font-weight="400">visible elsewhere. Finish the</text><text x="34" y="227.2" fill="#172b4d" font-size="17" font-weight="400">feasible crash, then leave.</text><text x="34" y="251.0" fill="#172b4d" font-size="17" font-weight="400">Remaining threats still</text><text x="34" y="274.8" fill="#172b4d" font-size="17" font-weight="400">matter.</text><rect x="20" y="340.6" width="300" height="163.40000000000003" rx="9" fill="#ffffff" stroke="#78869c"/><text x="34" y="366.6" fill="#1749bd" font-size="18" font-weight="700">B · Staying is too costly</text><text x="34" y="394.8" fill="#172b4d" font-size="17" font-weight="400">Nearly dead; clearing needs</text><text x="34" y="418.6" fill="#172b4d" font-size="17" font-weight="400">your escape tool; jungler</text><text x="34" y="442.40000000000003" fill="#172b4d" font-size="17" font-weight="400">missing. Leave with an</text><text x="34" y="466.20000000000005" fill="#172b4d" font-size="17" font-weight="400">imperfect wave.</text><text x="20" y="539.0" fill="#405574" font-size="17" font-weight="400">A crash brings your wave to the</text><text x="20" y="562.8" fill="#405574" font-size="17" font-weight="400">enemy turret. Improving the wave</text><text x="20" y="586.5999999999999" fill="#405574" font-size="17" font-weight="400">is conditional, not permission</text><text x="20" y="610.3999999999999" fill="#405574" font-size="17" font-weight="400">to stay or a free-return</text><text x="20" y="634.1999999999998" fill="#405574" font-size="17" font-weight="400">promise.</text></g><style>@media(prefers-color-scheme:dark){text{fill:#ededed}.label{fill:#9abaff}[fill="#f5f7fb"]{fill:#191919}[stroke="#f5f7fb"]{stroke:#191919}[fill="#ffffff"]{fill:#222222}[stroke="#ffffff"]{stroke:#222222}[fill="#fff"]{fill:#222222}[stroke="#fff"]{stroke:#222222}[fill="white"]{fill:#222222}[stroke="white"]{stroke:#222222}[fill="#dee5f3"]{fill:#2c2c2c}[stroke="#dee5f3"]{stroke:#2c2c2c}[fill="#172b4d"]{fill:#ededed}[stroke="#172b4d"]{stroke:#ededed}[fill="#405574"]{fill:#b5b5b5}[stroke="#405574"]{stroke:#b5b5b5}[fill="#1749bd"]{fill:#9abaff}[stroke="#1749bd"]{stroke:#9abaff}[fill="#dce2ed"]{fill:#424242}[stroke="#dce2ed"]{stroke:#424242}[fill="#78869c"]{fill:#777777}[stroke="#78869c"]{stroke:#777777}}</style></svg>