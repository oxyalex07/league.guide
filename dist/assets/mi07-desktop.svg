<svg xmlns="http://www.w3.org/2000/svg" width="680" height="730" viewBox="0 0 680 730" role="img" aria-labelledby="title desc"><title id="title">Spacing</title><desc id="desc">Hypothetical decision schematic. Distances are not game measurements.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#1749bd"/></marker></defs><rect width="100%" height="100%" fill="#f5f7fb"/><style>text{font-family:Arial,sans-serif;fill:#172b4d;font-size:17px}.label{font-weight:bold;fill:#1749bd}</style><text x="20" y="30" style="font-size:22px;font-weight:bold">Spacing</text><rect x="20" y="55" width="640" height="195" rx="8" fill="#ffffff" stroke="#dce2ed"/><text x="32" y="83" class="label">1 / COMPARE REACH</text><circle cx="80" cy="125" r="10" fill="#172b4d"/><circle cx="225" cy="125" r="10" fill="#1749bd"/><path d="M92 117H135 M213 137H70" fill="none" stroke="#1749bd" stroke-width="2" marker-end="url(#arrow)"/><text x="49" y="162">Enemy</text><text x="210" y="162">You</text><text x="32" y="204">You can act from this gap.</text><text x="32" y="231">Their shorter attack cannot.</text><rect x="20" y="265" width="640" height="195" rx="8" fill="#ffffff" stroke="#dce2ed"/><text x="32" y="293" class="label">2 / THREAT CHANGES</text><circle cx="80" cy="335" r="10" fill="#172b4d"/><circle cx="225" cy="335" r="10" fill="#1749bd"/><path d="M95 335H207" fill="none" stroke="#1749bd" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="49" y="372">Enemy</text><text x="210" y="372">You</text><text x="32" y="414">A dash can close the gap.</text><text x="32" y="441">Reassess the same position.</text><rect x="20" y="475" width="640" height="195" rx="8" fill="#ffffff" stroke="#dce2ed"/><text x="32" y="503" class="label">3 / KEEP AN EXIT</text><circle cx="80" cy="545" r="10" fill="#172b4d"/><circle cx="225" cy="545" r="10" fill="#1749bd"/><path d="M239 545H293" fill="none" stroke="#1749bd" stroke-width="2" marker-end="url(#arrow)"/><text x="49" y="582">Enemy</text><text x="210" y="582">You</text><text x="32" y="624">Move toward an open exit.</text><text x="32" y="651">Give up the attack if needed.</text><text x="20" y="712">Hypothetical · not to scale</text><style>@media(prefers-color-scheme:dark){text{fill:#ededed}.label{fill:#9abaff}[fill="#f5f7fb"]{fill:#191919}[stroke="#f5f7fb"]{stroke:#191919}[fill="#ffffff"]{fill:#222222}[stroke="#ffffff"]{stroke:#222222}[fill="#fff"]{fill:#222222}[stroke="#fff"]{stroke:#222222}[fill="white"]{fill:#222222}[stroke="white"]{stroke:#222222}[fill="#dee5f3"]{fill:#2c2c2c}[stroke="#dee5f3"]{stroke:#2c2c2c}[fill="#172b4d"]{fill:#ededed}[stroke="#172b4d"]{stroke:#ededed}[fill="#405574"]{fill:#b5b5b5}[stroke="#405574"]{stroke:#b5b5b5}[fill="#1749bd"]{fill:#9abaff}[stroke="#1749bd"]{stroke:#9abaff}[fill="#dce2ed"]{fill:#424242}[stroke="#dce2ed"]{stroke:#424242}[fill="#78869c"]{fill:#777777}[stroke="#78869c"]{stroke:#777777}}</style></svg>