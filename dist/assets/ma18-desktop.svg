<svg xmlns="http://www.w3.org/2000/svg" width="760" height="274" viewBox="0 0 760 274" role="img" aria-labelledby="title desc"><title id="title">Flanking</title><desc id="desc">Illustrative decision sequence; not to scale.</desc><style>.bg{fill:#f4f6fb}.card{fill:#fff;stroke:#d9e0ec}.num{fill:#224fc5}.numt{fill:#fff;font-weight:800}.lab{fill:#224fc5;font-weight:800;letter-spacing:.06em}.t{fill:#182a40}.lead{fill:#182a40;font-weight:650}.muted{fill:#5b6b80}.arrow{stroke:#224fc5;fill:none}text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media(prefers-color-scheme:dark){.bg{fill:#171717}.card{fill:#202020;stroke:#3a3a3a}.num{fill:#9abaff}.numt{fill:#111}.lab{fill:#9abaff}.t,.lead{fill:#ededed}.muted{fill:#a8a8a8}.arrow{stroke:#9abaff}}</style><rect class="bg" width="760" height="274" rx="16"/><text x="24" y="38" class="lead" style="font-size:19px">Flanking</text><rect class="card" x="24" y="64" width="220" height="158" rx="14"/><circle class="num" cx="54" cy="96" r="15"/><text class="numt" x="54" y="101" text-anchor="middle" style="font-size:14px">1</text><text class="lab" x="78" y="101" style="font-size:13px">FRONT</text><text class="t" x="42" y="140" style="font-size:15px">Allied group ↔ enemy</text><text class="t" x="42" y="162" style="font-size:15px">group Keep pressure</text><text class="t" x="42" y="184" style="font-size:15px">connected.</text><path class="arrow" d="M248 143.0 h20 m-6 -6 l6 6 l-6 6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect class="card" x="274" y="64" width="220" height="158" rx="14"/><circle class="num" cx="304" cy="96" r="15"/><text class="numt" x="304" y="101" text-anchor="middle" style="font-size:14px">2</text><text class="lab" x="328" y="101" style="font-size:13px">SIDE</text><text class="t" x="292" y="140" style="font-size:15px">You take a separate</text><text class="t" x="292" y="162" style="font-size:15px">approach Travel time</text><text class="t" x="292" y="184" style="font-size:15px">creates a gap.</text><path class="arrow" d="M498 143.0 h20 m-6 -6 l6 6 l-6 6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect class="card" x="524" y="64" width="220" height="158" rx="14"/><circle class="num" cx="554" cy="96" r="15"/><text class="numt" x="554" y="101" text-anchor="middle" style="font-size:14px">3</text><text class="lab" x="578" y="101" style="font-size:13px">ARRIVAL</text><text class="t" x="542" y="140" style="font-size:15px">Group retreats before you</text><text class="t" x="542" y="162" style="font-size:15px">arrive Cancel the</text><text class="t" x="542" y="184" style="font-size:15px">isolated entry.</text><text class="muted" x="24" y="256" style="font-size:12px">Illustrative · not to scale</text></svg>