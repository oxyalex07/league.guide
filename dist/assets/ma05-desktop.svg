<svg xmlns="http://www.w3.org/2000/svg" width="680" height="621" viewBox="0 0 680 621" role="img" aria-labelledby="title desc"><title id="title">MA05 — One route watched; one unknown</title><desc id="desc">An abstract watched approach and a second unknown approach converge toward a side wave. A ward answers only the first-route question; the player keeps an exit and plans to leave when a threat appears.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#1749bd"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#fff"/><path d="M0 8L8 0" stroke="#dce2ed"/></pattern></defs><rect width="100%" height="100%" fill="#f5f7fb"/><g font-family="Arial, sans-serif"><text x="20" y="28" fill="#172b4d" font-size="22" font-weight="700">One route watched; one unknown</text><text x="20" y="58.8" fill="#405574" font-size="17" font-weight="400">Hypothetical · not to scale</text><text x="20" y="94.6" fill="#1749bd" font-size="18" font-weight="700">Question: approach along this route?</text><path d="M65 134.8L340.0 219.8" fill="none" stroke="#1749bd" stroke-width="3"/><path d="M615 134.8L340.0 219.8" fill="none" stroke="#405574" stroke-width="3" stroke-dasharray="5 5"/><rect x="57" y="147.8" width="16" height="16" fill="white" stroke="#1749bd" stroke-width="3"/><circle cx="340.0" cy="227.8" r="10" fill="#1749bd"/><text x="20" y="119.8" font-size="17" fill="#172b4d">Watched</text><text x="558" y="119.8" font-size="17" fill="#172b4d">Unknown</text><rect x="20" y="262.8" width="640" height="115.80000000000001" rx="9" fill="#ffffff" stroke="#78869c"/><text x="34" y="288.8" fill="#1749bd" font-size="18" font-weight="700">Side wave · keep an exit</text><text x="34" y="317.0" fill="#172b4d" font-size="17" font-weight="400">Square: reachable observation point on one approach. Circle:</text><text x="34" y="340.8" fill="#172b4d" font-size="17" font-weight="400">player collecting. Dashed route: uncovered alternative.</text><rect x="20" y="406.6" width="640" height="115.80000000000007" rx="9" fill="#ffffff" stroke="#78869c"/><text x="34" y="432.6" fill="#1749bd" font-size="18" font-weight="700">Response</text><text x="34" y="460.8" fill="#172b4d" font-size="17" font-weight="400">Leave when a threat appears. Collect only as far as an acceptable</text><text x="34" y="484.6" fill="#172b4d" font-size="17" font-weight="400">retreat permits.</text><text x="20" y="557.4000000000001" fill="#405574" font-size="17" font-weight="400">Abstract branching paths, not map geography or a coverage radius. A</text><text x="20" y="581.2" fill="#405574" font-size="17" font-weight="400">useful warning leaves other routes unknown.</text></g><style>@media(prefers-color-scheme:dark){text{fill:#ededed}.label{fill:#9abaff}[fill="#f5f7fb"]{fill:#191919}[stroke="#f5f7fb"]{stroke:#191919}[fill="#ffffff"]{fill:#222222}[stroke="#ffffff"]{stroke:#222222}[fill="#fff"]{fill:#222222}[stroke="#fff"]{stroke:#222222}[fill="white"]{fill:#222222}[stroke="white"]{stroke:#222222}[fill="#dee5f3"]{fill:#2c2c2c}[stroke="#dee5f3"]{stroke:#2c2c2c}[fill="#172b4d"]{fill:#ededed}[stroke="#172b4d"]{stroke:#ededed}[fill="#405574"]{fill:#b5b5b5}[stroke="#405574"]{stroke:#b5b5b5}[fill="#1749bd"]{fill:#9abaff}[stroke="#1749bd"]{stroke:#9abaff}[fill="#dce2ed"]{fill:#424242}[stroke="#dce2ed"]{stroke:#424242}[fill="#78869c"]{fill:#777777}[stroke="#78869c"]{stroke:#777777}}</style></svg>