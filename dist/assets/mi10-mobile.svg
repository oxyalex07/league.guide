<svg xmlns="http://www.w3.org/2000/svg" width="340" height="834" viewBox="0 0 340 834" role="img" aria-labelledby="title desc"><title id="title">MI10 — Two ordinary-attack cues</title><desc id="desc">Ordinary melee: start attack, wait for registered damage, move in recovery. Ordinary ranged: start attack, wait for projectile release, move in recovery without waiting for later impact. Reassess readiness and safety before attacking again.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#1749bd"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#fff"/><path d="M0 8L8 0" stroke="#dce2ed"/></pattern></defs><rect width="100%" height="100%" fill="#f5f7fb"/><g font-family="Arial, sans-serif"><text x="20" y="28" fill="#172b4d" font-size="22" font-weight="700">Two ordinary-attack cues</text><text x="20" y="58.8" fill="#405574" font-size="17" font-weight="400">Hypothetical · not to scale</text><rect x="20" y="94.6" width="300" height="163.4" rx="9" fill="#ffffff" stroke="#78869c"/><text x="34" y="120.6" fill="#1749bd" font-size="18" font-weight="700">Ordinary melee</text><text x="34" y="148.79999999999998" fill="#172b4d" font-size="17" font-weight="400">Start attack → DAMAGE</text><text x="34" y="172.59999999999997" fill="#172b4d" font-size="17" font-weight="400">REGISTERS → move during</text><text x="34" y="196.39999999999998" fill="#172b4d" font-size="17" font-weight="400">recovery → next attack if</text><text x="34" y="220.2" fill="#172b4d" font-size="17" font-weight="400">ready and safe.</text><rect x="20" y="286.0" width="300" height="163.40000000000003" rx="9" fill="#ffffff" stroke="#78869c"/><text x="34" y="312.0" fill="#1749bd" font-size="18" font-weight="700">Ordinary ranged</text><text x="34" y="340.2" fill="#172b4d" font-size="17" font-weight="400">Start attack → PROJECTILE</text><text x="34" y="364.0" fill="#172b4d" font-size="17" font-weight="400">LEAVES MODEL → move during</text><text x="34" y="387.8" fill="#172b4d" font-size="17" font-weight="400">recovery → next attack if</text><text x="34" y="411.6" fill="#172b4d" font-size="17" font-weight="400">ready and safe.</text><rect x="20" y="477.40000000000003" width="300" height="187.19999999999976" rx="9" fill="#ffffff" stroke="#78869c" stroke-dasharray="7 5"/><text x="34" y="503.40000000000003" fill="#1749bd" font-size="18" font-weight="700">Ranged impact is later</text><text x="34" y="531.6" fill="#172b4d" font-size="17" font-weight="400">Projectile release ···→</text><text x="34" y="555.4" fill="#172b4d" font-size="17" font-weight="400">target impact. Impact is not</text><text x="34" y="579.1999999999999" fill="#172b4d" font-size="17" font-weight="400">the movement cue. Dots mean</text><text x="34" y="602.9999999999999" fill="#172b4d" font-size="17" font-weight="400">projectile travel, not</text><text x="34" y="626.7999999999998" fill="#172b4d" font-size="17" font-weight="400">measured time.</text><text x="20" y="699.5999999999998" fill="#405574" font-size="17" font-weight="400">Ordinary attacks only. Special</text><text x="20" y="723.3999999999997" fill="#405574" font-size="17" font-weight="400">attacks, resets and empowered</text><text x="20" y="747.1999999999997" fill="#405574" font-size="17" font-weight="400">exceptions excluded. Abstract</text><text x="20" y="770.9999999999997" fill="#405574" font-size="17" font-weight="400">sequence; no champion animation</text><text x="20" y="794.7999999999996" fill="#405574" font-size="17" font-weight="400">demonstrated.</text></g><style>@media(prefers-color-scheme:dark){text{fill:#ededed}.label{fill:#9abaff}[fill="#f5f7fb"]{fill:#191919}[stroke="#f5f7fb"]{stroke:#191919}[fill="#ffffff"]{fill:#222222}[stroke="#ffffff"]{stroke:#222222}[fill="#fff"]{fill:#222222}[stroke="#fff"]{stroke:#222222}[fill="white"]{fill:#222222}[stroke="white"]{stroke:#222222}[fill="#dee5f3"]{fill:#2c2c2c}[stroke="#dee5f3"]{stroke:#2c2c2c}[fill="#172b4d"]{fill:#ededed}[stroke="#172b4d"]{stroke:#ededed}[fill="#405574"]{fill:#b5b5b5}[stroke="#405574"]{stroke:#b5b5b5}[fill="#1749bd"]{fill:#9abaff}[stroke="#1749bd"]{stroke:#9abaff}[fill="#dce2ed"]{fill:#424242}[stroke="#dce2ed"]{stroke:#424242}[fill="#78869c"]{fill:#777777}[stroke="#78869c"]{stroke:#777777}}</style></svg>