<svg xmlns="http://www.w3.org/2000/svg" width="340" height="798" viewBox="0 0 340 798" role="img" aria-labelledby="title desc"><title id="title">MA06 — A sighting is not a route</title><desc id="desc">A solid observation says seen top now. A dashed inference suggests a likely area and an alternative. Without fresh evidence the location becomes unknown, shown with hatching. No hidden route is revealed.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#1749bd"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#fff"/><path d="M0 8L8 0" stroke="#dce2ed"/></pattern></defs><rect width="100%" height="100%" fill="#f5f7fb"/><g font-family="Arial, sans-serif"><text x="20" y="28" fill="#172b4d" font-size="22" font-weight="700">A sighting is not a</text><text x="20" y="58.8" fill="#172b4d" font-size="22" font-weight="700">route</text><text x="20" y="89.6" fill="#405574" font-size="17" font-weight="400">Hypothetical · not to scale</text><rect x="20" y="125.39999999999999" width="300" height="115.8" rx="9" fill="#ffffff" stroke="#78869c"/><text x="34" y="151.39999999999998" fill="#1749bd" font-size="18" font-weight="700">OBSERVED · solid border</text><text x="34" y="179.59999999999997" fill="#172b4d" font-size="17" font-weight="400">Seen top now. This records a</text><text x="34" y="203.39999999999998" fill="#172b4d" font-size="17" font-weight="400">sighting, not the next route.</text><path d="M170.0 264.2v15" stroke="#1749bd" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="295.2" width="300" height="163.40000000000003" rx="9" fill="#ffffff" stroke="#78869c" stroke-dasharray="7 5"/><text x="34" y="321.2" fill="#1749bd" font-size="18" font-weight="700">INFERRED · dashed border</text><text x="34" y="349.4" fill="#172b4d" font-size="17" font-weight="400">Likely area plus an</text><text x="34" y="373.2" fill="#172b4d" font-size="17" font-weight="400">alternative: the jungler may</text><text x="34" y="397.0" fill="#172b4d" font-size="17" font-weight="400">leave top quickly. Choose a</text><text x="34" y="420.8" fill="#172b4d" font-size="17" font-weight="400">brief action with an exit.</text><path d="M170.0 481.6v15" stroke="#1749bd" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="512.6" width="300" height="139.5999999999999" rx="9" fill="url(#hatch)" stroke="#78869c"/><text x="34" y="538.6" fill="#1749bd" font-size="18" font-weight="700">UNKNOWN · hatched fill</text><text x="34" y="566.8000000000001" fill="#172b4d" font-size="17" font-weight="400">No fresh sighting: stop</text><text x="34" y="590.6" fill="#172b4d" font-size="17" font-weight="400">relying on the old location.</text><text x="34" y="614.4" fill="#172b4d" font-size="17" font-weight="400">Shorten the next push.</text><text x="20" y="687.1999999999999" fill="#405574" font-size="17" font-weight="400">Qualitative sequence. No</text><text x="20" y="710.9999999999999" fill="#405574" font-size="17" font-weight="400">universal freshness timer,</text><text x="20" y="734.7999999999998" fill="#405574" font-size="17" font-weight="400">route, probability or mandatory</text><text x="20" y="758.5999999999998" fill="#405574" font-size="17" font-weight="400">clear.</text></g><style>@media(prefers-color-scheme:dark){text{fill:#ededed}.label{fill:#9abaff}[fill="#f5f7fb"]{fill:#191919}[stroke="#f5f7fb"]{stroke:#191919}[fill="#ffffff"]{fill:#222222}[stroke="#ffffff"]{stroke:#222222}[fill="#fff"]{fill:#222222}[stroke="#fff"]{stroke:#222222}[fill="white"]{fill:#222222}[stroke="white"]{stroke:#222222}[fill="#dee5f3"]{fill:#2c2c2c}[stroke="#dee5f3"]{stroke:#2c2c2c}[fill="#172b4d"]{fill:#ededed}[stroke="#172b4d"]{stroke:#ededed}[fill="#405574"]{fill:#b5b5b5}[stroke="#405574"]{stroke:#b5b5b5}[fill="#1749bd"]{fill:#9abaff}[stroke="#1749bd"]{stroke:#9abaff}[fill="#dce2ed"]{fill:#424242}[stroke="#dce2ed"]{stroke:#424242}[fill="#78869c"]{fill:#777777}[stroke="#78869c"]{stroke:#777777}}</style></svg>