<svg xmlns="http://www.w3.org/2000/svg" width="680" height="881" viewBox="0 0 680 881" role="img" aria-labelledby="title desc"><title id="title">MI09 — Check the exit and destination</title><desc id="desc">With enough time and room, the player can leave a straight projectile corridor toward allies. The other side leads toward an enemy. A wall can remove the preferred exit, requiring reassessment.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#1749bd"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#fff"/><path d="M0 8L8 0" stroke="#dce2ed"/></pattern></defs><rect width="100%" height="100%" fill="#f5f7fb"/><g font-family="Arial, sans-serif"><text x="20" y="28" fill="#172b4d" font-size="22" font-weight="700">Check the exit and destination</text><text x="20" y="58.8" fill="#405574" font-size="17" font-weight="400">Hypothetical · not to scale</text><text x="20" y="94.6" fill="#1749bd" font-size="18" font-weight="700">A · Assume enough time and room</text><rect x="310.0" y="119.8" width="60" height="160" fill="#dee5f3" stroke="#78869c"/><path d="M340.0 122.8v47" stroke="#1749bd" stroke-width="3" marker-end="url(#arrow)"/><circle cx="340.0" cy="214.8" r="12" fill="white" stroke="#172b4d" stroke-width="3"/><path d="M326.0 214.8H55V259.8" fill="none" stroke="#1749bd" stroke-width="3" marker-end="url(#arrow)"/><path d="M354.0 214.8H625" stroke="#1749bd" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow)"/><path d="M625 251.8l10 18h-20z" fill="white" stroke="#172b4d" stroke-width="2"/><text x="20" y="304.8" fill="#172b4d" font-size="17" font-weight="400">Strip: projectile corridor. Circle: you. Triangle: another enemy.</text><text x="20" y="328.6" fill="#172b4d" font-size="17" font-weight="400">Arrows: possible moves.</text><rect x="20" y="352.40000000000003" width="640" height="115.80000000000001" rx="9" fill="#ffffff" stroke="#78869c"/><text x="34" y="378.40000000000003" fill="#1749bd" font-size="18" font-weight="700">Left · exit, then retreat</text><text x="34" y="406.6" fill="#172b4d" font-size="17" font-weight="400">The illustrated left exit leads toward allies. Check the full</text><text x="34" y="430.40000000000003" fill="#172b4d" font-size="17" font-weight="400">corridor and your onward destination.</text><rect x="20" y="496.20000000000005" width="640" height="115.79999999999995" rx="9" fill="#ffffff" stroke="#78869c"/><text x="34" y="522.2" fill="#1749bd" font-size="18" font-weight="700">Right · another threat</text><text x="34" y="550.4000000000001" fill="#172b4d" font-size="17" font-weight="400">The illustrated right exit leads toward an enemy. Missing the</text><text x="34" y="574.2" fill="#172b4d" font-size="17" font-weight="400">shot alone is not enough.</text><text x="20" y="640.0" fill="#1749bd" font-size="18" font-weight="700">B · Wall removes that exit</text><rect x="310.0" y="665.2" width="60" height="75" fill="#dee5f3" stroke="#78869c"/><circle cx="340.0" cy="700.2" r="12" fill="white" stroke="#172b4d" stroke-width="3"/><path d="M326.0 700.2H275.0" stroke="#1749bd" stroke-width="2"/><rect x="258.0" y="670.2" width="17" height="60" fill="url(#hatch)" stroke="#172b4d" stroke-width="2"/><text x="20" y="763.2" fill="#172b4d" font-size="17" font-weight="400">Hatched barrier: wall. Reassess available space; neither side is</text><text x="20" y="787.0" fill="#172b4d" font-size="17" font-weight="400">guaranteed reachable.</text><text x="20" y="817.8" fill="#405574" font-size="17" font-weight="400">Only a visible straight travelling segment. No measured collision</text><text x="20" y="841.5999999999999" fill="#405574" font-size="17" font-weight="400">width; returns and splits need a new assessment.</text></g><style>@media(prefers-color-scheme:dark){text{fill:#ededed}.label{fill:#9abaff}[fill="#f5f7fb"]{fill:#191919}[stroke="#f5f7fb"]{stroke:#191919}[fill="#ffffff"]{fill:#222222}[stroke="#ffffff"]{stroke:#222222}[fill="#fff"]{fill:#222222}[stroke="#fff"]{stroke:#222222}[fill="white"]{fill:#222222}[stroke="white"]{stroke:#222222}[fill="#dee5f3"]{fill:#2c2c2c}[stroke="#dee5f3"]{stroke:#2c2c2c}[fill="#172b4d"]{fill:#ededed}[stroke="#172b4d"]{stroke:#ededed}[fill="#405574"]{fill:#b5b5b5}[stroke="#405574"]{stroke:#b5b5b5}[fill="#1749bd"]{fill:#9abaff}[stroke="#1749bd"]{stroke:#9abaff}[fill="#dce2ed"]{fill:#424242}[stroke="#dce2ed"]{stroke:#424242}[fill="#78869c"]{fill:#777777}[stroke="#78869c"]{stroke:#777777}}</style></svg>