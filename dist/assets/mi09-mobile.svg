<svg xmlns="http://www.w3.org/2000/svg" width="340" height="1127" viewBox="0 0 340 1127" role="img" aria-labelledby="title desc"><title id="title">MI09 — Check the exit and destination</title><desc id="desc">With enough time and room, the player can leave a straight projectile corridor toward allies. The other side leads toward an enemy. A wall can remove the preferred exit, requiring reassessment.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#1749bd"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#fff"/><path d="M0 8L8 0" stroke="#dce2ed"/></pattern></defs><rect width="100%" height="100%" fill="#f5f7fb"/><g font-family="Arial, sans-serif"><text x="20" y="28" fill="#172b4d" font-size="22" font-weight="700">Check the exit and</text><text x="20" y="58.8" fill="#172b4d" font-size="22" font-weight="700">destination</text><text x="20" y="89.6" fill="#405574" font-size="17" font-weight="400">Hypothetical · not to scale</text><text x="20" y="125.39999999999999" fill="#1749bd" font-size="18" font-weight="700">A · Assume enough time and</text><text x="20" y="150.6" fill="#1749bd" font-size="18" font-weight="700">room</text><rect x="140.0" y="175.79999999999998" width="60" height="160" fill="#dee5f3" stroke="#78869c"/><path d="M170.0 178.79999999999998v47" stroke="#1749bd" stroke-width="3" marker-end="url(#arrow)"/><circle cx="170.0" cy="270.79999999999995" r="12" fill="white" stroke="#172b4d" stroke-width="3"/><path d="M156.0 270.79999999999995H55V315.79999999999995" fill="none" stroke="#1749bd" stroke-width="3" marker-end="url(#arrow)"/><path d="M184.0 270.79999999999995H285" stroke="#1749bd" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow)"/><path d="M285 307.79999999999995l10 18h-20z" fill="white" stroke="#172b4d" stroke-width="2"/><text x="20" y="360.79999999999995" fill="#172b4d" font-size="17" font-weight="400">Strip: projectile corridor.</text><text x="20" y="384.59999999999997" fill="#172b4d" font-size="17" font-weight="400">Circle: you. Triangle: another</text><text x="20" y="408.4" fill="#172b4d" font-size="17" font-weight="400">enemy. Arrows: possible moves.</text><rect x="20" y="432.2" width="300" height="163.39999999999992" rx="9" fill="#ffffff" stroke="#78869c"/><text x="34" y="458.2" fill="#1749bd" font-size="18" font-weight="700">Left · exit, then retreat</text><text x="34" y="486.4" fill="#172b4d" font-size="17" font-weight="400">The illustrated left exit</text><text x="34" y="510.2" fill="#172b4d" font-size="17" font-weight="400">leads toward allies. Check</text><text x="34" y="534.0" fill="#172b4d" font-size="17" font-weight="400">the full corridor and your</text><text x="34" y="557.8" fill="#172b4d" font-size="17" font-weight="400">onward destination.</text><rect x="20" y="623.5999999999999" width="300" height="163.39999999999986" rx="9" fill="#ffffff" stroke="#78869c"/><text x="34" y="649.5999999999999" fill="#1749bd" font-size="18" font-weight="700">Right · another threat</text><text x="34" y="677.8" fill="#172b4d" font-size="17" font-weight="400">The illustrated right exit</text><text x="34" y="701.5999999999999" fill="#172b4d" font-size="17" font-weight="400">leads toward an enemy.</text><text x="34" y="725.3999999999999" fill="#172b4d" font-size="17" font-weight="400">Missing the shot alone is not</text><text x="34" y="749.1999999999998" fill="#172b4d" font-size="17" font-weight="400">enough.</text><text x="20" y="814.9999999999998" fill="#1749bd" font-size="18" font-weight="700">B · Wall removes that exit</text><rect x="140.0" y="840.1999999999998" width="60" height="75" fill="#dee5f3" stroke="#78869c"/><circle cx="170.0" cy="875.1999999999998" r="12" fill="white" stroke="#172b4d" stroke-width="3"/><path d="M156.0 875.1999999999998H105.0" stroke="#1749bd" stroke-width="2"/><rect x="88.0" y="845.1999999999998" width="17" height="60" fill="url(#hatch)" stroke="#172b4d" stroke-width="2"/><text x="20" y="938.1999999999998" fill="#172b4d" font-size="17" font-weight="400">Hatched barrier: wall. Reassess</text><text x="20" y="961.9999999999998" fill="#172b4d" font-size="17" font-weight="400">available space; neither side is</text><text x="20" y="985.7999999999997" fill="#172b4d" font-size="17" font-weight="400">guaranteed reachable.</text><text x="20" y="1016.5999999999997" fill="#405574" font-size="17" font-weight="400">Only a visible straight</text><text x="20" y="1040.3999999999996" fill="#405574" font-size="17" font-weight="400">travelling segment. No measured</text><text x="20" y="1064.1999999999996" fill="#405574" font-size="17" font-weight="400">collision width; returns and</text><text x="20" y="1087.9999999999995" fill="#405574" font-size="17" font-weight="400">splits need a new assessment.</text></g><style>@media(prefers-color-scheme:dark){text{fill:#ededed}.label{fill:#9abaff}[fill="#f5f7fb"]{fill:#191919}[stroke="#f5f7fb"]{stroke:#191919}[fill="#ffffff"]{fill:#222222}[stroke="#ffffff"]{stroke:#222222}[fill="#fff"]{fill:#222222}[stroke="#fff"]{stroke:#222222}[fill="white"]{fill:#222222}[stroke="white"]{stroke:#222222}[fill="#dee5f3"]{fill:#2c2c2c}[stroke="#dee5f3"]{stroke:#2c2c2c}[fill="#172b4d"]{fill:#ededed}[stroke="#172b4d"]{stroke:#ededed}[fill="#405574"]{fill:#b5b5b5}[stroke="#405574"]{stroke:#b5b5b5}[fill="#1749bd"]{fill:#9abaff}[stroke="#1749bd"]{stroke:#9abaff}[fill="#dce2ed"]{fill:#424242}[stroke="#dce2ed"]{stroke:#424242}[fill="#78869c"]{fill:#777777}[stroke="#78869c"]{stroke:#777777}}</style></svg>