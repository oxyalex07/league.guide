<svg xmlns="http://www.w3.org/2000/svg" width="360" height="521" viewBox="0 0 360 521" role="img" aria-labelledby="title desc"><title id="title">Spacing</title><desc id="desc">Hypothetical decision schematic. Distances are not game measurements.</desc><style>.bg{fill:#f4f6fb}.card{fill:#fff;stroke:#d9e0ec}.num{fill:#224fc5}.numt{fill:#fff;font-weight:800}.lab{fill:#224fc5;font-weight:800;letter-spacing:.06em}.t{fill:#182a40}.lead{fill:#182a40;font-weight:650}.muted{fill:#5b6b80}.arrow{stroke:#224fc5;fill:none}text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media(prefers-color-scheme:dark){.bg{fill:#171717}.card{fill:#202020;stroke:#3a3a3a}.num{fill:#9abaff}.numt{fill:#111}.lab{fill:#9abaff}.t,.lead{fill:#ededed}.muted{fill:#a8a8a8}.arrow{stroke:#9abaff}}</style><rect class="bg" width="360" height="521" rx="16"/><text x="16" y="34" class="lead" style="font-size:18px">Spacing</text><rect class="card" x="16" y="56" width="328" height="123" rx="14"/><circle class="num" cx="42" cy="84" r="13"/><text class="numt" x="42" y="89" text-anchor="middle" style="font-size:13px">1</text><text class="lab" x="64" y="89" style="font-size:12px">COMPARE REACH</text><text class="lead" x="32" y="120" style="font-size:14px">Enemy You You can act from this</text><text class="lead" x="32" y="141" style="font-size:14px">gap.</text><text class="t" x="32" y="162" style="font-size:14px">Their shorter attack cannot.</text><path class="arrow" d="M180.0 184 v14 m-6 -6 l6 6 l6 -6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect class="card" x="16" y="205" width="328" height="123" rx="14"/><circle class="num" cx="42" cy="233" r="13"/><text class="numt" x="42" y="238" text-anchor="middle" style="font-size:13px">2</text><text class="lab" x="64" y="238" style="font-size:12px">THREAT CHANGES</text><text class="lead" x="32" y="269" style="font-size:14px">Enemy You A dash can close the</text><text class="lead" x="32" y="290" style="font-size:14px">gap.</text><text class="t" x="32" y="311" style="font-size:14px">Reassess the same position.</text><path class="arrow" d="M180.0 333 v14 m-6 -6 l6 6 l6 -6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect class="card" x="16" y="354" width="328" height="123" rx="14"/><circle class="num" cx="42" cy="382" r="13"/><text class="numt" x="42" y="387" text-anchor="middle" style="font-size:13px">3</text><text class="lab" x="64" y="387" style="font-size:12px">KEEP AN EXIT</text><text class="lead" x="32" y="418" style="font-size:14px">Enemy You Move toward an open</text><text class="lead" x="32" y="439" style="font-size:14px">exit.</text><text class="t" x="32" y="460" style="font-size:14px">Give up the attack if needed.</text><text class="muted" x="16" y="511" style="font-size:11px">Hypothetical · not to scale</text></svg>