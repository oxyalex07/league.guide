<svg xmlns="http://www.w3.org/2000/svg" width="680" height="648" viewBox="0 0 680 648" role="img" aria-labelledby="title desc"><title id="title">MA04 — Opportunity is not arrival</title><desc id="desc">A wave is pushed near the enemy turret, but allied mid recalls while enemy mid moves toward river. The jungler pauses at a safe entrance because the opportunity is not available support.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#1749bd"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#fff"/><path d="M0 8L8 0" stroke="#dce2ed"/></pattern></defs><rect width="100%" height="100%" fill="#f5f7fb"/><g font-family="Arial, sans-serif"><text x="20" y="28" fill="#172b4d" font-size="22" font-weight="700">Opportunity is not arrival</text><text x="20" y="58.8" fill="#405574" font-size="17" font-weight="400">Hypothetical · not to scale</text><rect x="20" y="94.6" width="640" height="115.79999999999998" rx="9" fill="#ffffff" stroke="#78869c"/><text x="34" y="120.6" fill="#1749bd" font-size="18" font-weight="700">Wave opportunity</text><text x="34" y="148.79999999999998" fill="#172b4d" font-size="17" font-weight="400">Your wave is near the enemy turret. This creates an opportunity</text><text x="34" y="172.59999999999997" fill="#172b4d" font-size="17" font-weight="400">to move.</text><path d="M340.0 233.39999999999998v15" stroke="#1749bd" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="264.4" width="640" height="115.80000000000001" rx="9" fill="#ffffff" stroke="#78869c"/><text x="34" y="290.4" fill="#1749bd" font-size="18" font-weight="700">Actual movements</text><text x="34" y="318.59999999999997" fill="#172b4d" font-size="17" font-weight="400">Allied mid → base (recalling). Enemy mid → river. These are the</text><text x="34" y="342.4" fill="#172b4d" font-size="17" font-weight="400">stated example movements.</text><path d="M340.0 403.2v15" stroke="#1749bd" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="434.2" width="640" height="115.7999999999999" rx="9" fill="#ffffff" stroke="#78869c"/><text x="34" y="460.2" fill="#1749bd" font-size="18" font-weight="700">Available support</text><text x="34" y="488.4" fill="#172b4d" font-size="17" font-weight="400">Jungler stops at safe entrance. The recalling ally is not river</text><text x="34" y="512.1999999999999" fill="#172b4d" font-size="17" font-weight="400">support.</text><text x="20" y="584.9999999999999" fill="#405574" font-size="17" font-weight="400">No travel estimates or promised fight outcome. Check actual</text><text x="20" y="608.7999999999998" fill="#405574" font-size="17" font-weight="400">movement, resources and access.</text></g></svg>