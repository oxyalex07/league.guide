<svg xmlns="http://www.w3.org/2000/svg" width="340" height="590" viewBox="0 0 340 590" role="img" aria-labelledby="title desc"><title id="title">Target selection</title><desc id="desc">Decision diagram for target selection: ROLE — Damage, protect or disrupt?. ACCESS — Which target can you affect?. SWITCH — New threat changes priority.</desc><rect width="100%" height="100%" fill="#f5f7fb"/><style>text{font-family:Arial,sans-serif;fill:#172b4d;font-size:16px}.label{fill:#1749bd;font-weight:bold}</style><text x="20" y="35" style="font-size:24px">Target selection</text><rect x="16" y="60" width="308" height="145" rx="8" fill="white" stroke="#dce2ed"/><text x="28" y="88" class="label">1 / ROLE</text><text x="28" y="122">Damage, protect or disrupt?</text><path d="M170 208v14m-5 -5l5 5 5 -5" stroke="#1749bd" stroke-width="2" fill="none"/><rect x="16" y="225" width="308" height="145" rx="8" fill="white" stroke="#dce2ed"/><text x="28" y="253" class="label">2 / ACCESS</text><text x="28" y="287">Which target can you affect?</text><path d="M170 373v14m-5 -5l5 5 5 -5" stroke="#1749bd" stroke-width="2" fill="none"/><rect x="16" y="390" width="308" height="145" rx="8" fill="white" stroke="#dce2ed"/><text x="28" y="418" class="label">3 / SWITCH</text><text x="28" y="452">New threat changes priority</text><text x="20" y="575">Illustrative · not to scale</text></svg>