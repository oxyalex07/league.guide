<svg xmlns="http://www.w3.org/2000/svg" width="340" height="798" viewBox="0 0 340 798" role="img" aria-labelledby="title desc"><title id="title">MA04 — Opportunity is not arrival</title><desc id="desc">A wave is pushed near the enemy turret, but allied mid recalls while enemy mid moves toward river. The jungler pauses at a safe entrance because the opportunity is not available support.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#1749bd"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#fff"/><path d="M0 8L8 0" stroke="#dce2ed"/></pattern></defs><rect width="100%" height="100%" fill="#f5f7fb"/><g font-family="Arial, sans-serif"><text x="20" y="28" fill="#172b4d" font-size="22" font-weight="700">Opportunity is not</text><text x="20" y="58.8" fill="#172b4d" font-size="22" font-weight="700">arrival</text><text x="20" y="89.6" fill="#405574" font-size="17" font-weight="400">Hypothetical · not to scale</text><rect x="20" y="125.39999999999999" width="300" height="139.60000000000002" rx="9" fill="#ffffff" stroke="#78869c"/><text x="34" y="151.39999999999998" fill="#1749bd" font-size="18" font-weight="700">Wave opportunity</text><text x="34" y="179.59999999999997" fill="#172b4d" font-size="17" font-weight="400">Your wave is near the enemy</text><text x="34" y="203.39999999999998" fill="#172b4d" font-size="17" font-weight="400">turret. This creates an</text><text x="34" y="227.2" fill="#172b4d" font-size="17" font-weight="400">opportunity to move.</text><path d="M170.0 288.0v15" stroke="#1749bd" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="319.0" width="300" height="163.40000000000003" rx="9" fill="#ffffff" stroke="#78869c"/><text x="34" y="345.0" fill="#1749bd" font-size="18" font-weight="700">Actual movements</text><text x="34" y="373.2" fill="#172b4d" font-size="17" font-weight="400">Allied mid → base</text><text x="34" y="397.0" fill="#172b4d" font-size="17" font-weight="400">(recalling). Enemy mid →</text><text x="34" y="420.8" fill="#172b4d" font-size="17" font-weight="400">river. These are the stated</text><text x="34" y="444.6" fill="#172b4d" font-size="17" font-weight="400">example movements.</text><path d="M170.0 505.40000000000003v15" stroke="#1749bd" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="536.4000000000001" width="300" height="139.5999999999999" rx="9" fill="#ffffff" stroke="#78869c"/><text x="34" y="562.4000000000001" fill="#1749bd" font-size="18" font-weight="700">Available support</text><text x="34" y="590.6000000000001" fill="#172b4d" font-size="17" font-weight="400">Jungler stops at safe</text><text x="34" y="614.4000000000001" fill="#172b4d" font-size="17" font-weight="400">entrance. The recalling ally</text><text x="34" y="638.2" fill="#172b4d" font-size="17" font-weight="400">is not river support.</text><text x="20" y="711.0" fill="#405574" font-size="17" font-weight="400">No travel estimates or promised</text><text x="20" y="734.8" fill="#405574" font-size="17" font-weight="400">fight outcome. Check actual</text><text x="20" y="758.5999999999999" fill="#405574" font-size="17" font-weight="400">movement, resources and access.</text></g></svg>