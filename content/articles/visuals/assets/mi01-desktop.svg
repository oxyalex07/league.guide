<svg xmlns="http://www.w3.org/2000/svg" width="680" height="429" viewBox="0 0 680 429" role="img" aria-labelledby="title desc"><title id="title">MI01 — Damage arrival decides</title><desc id="desc">In a late attempt, an allied shot kills the minion before the player&#x27;s projectile arrives. An earlier input can secure a last hit only if the arriving damage is lethal.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#1749bd"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#fff"/><path d="M0 8L8 0" stroke="#dce2ed"/></pattern></defs><rect width="100%" height="100%" fill="#f5f7fb"/><g font-family="Arial, sans-serif"><text x="20" y="28" fill="#172b4d" font-size="22" font-weight="700">Damage arrival decides</text><text x="20" y="58.8" fill="#405574" font-size="17" font-weight="400">Hypothetical · not to scale</text><rect x="20" y="94.6" width="640" height="115.79999999999998" rx="9" fill="#ffffff" stroke="#78869c"/><text x="34" y="120.6" fill="#1749bd" font-size="18" font-weight="700">Late attempt</text><text x="34" y="148.79999999999998" fill="#172b4d" font-size="17" font-weight="400">Your input → projectile travels → allied shot kills minion → your</text><text x="34" y="172.59999999999997" fill="#172b4d" font-size="17" font-weight="400">damage arrives too late.</text><rect x="20" y="238.39999999999998" width="640" height="92.0" rx="9" fill="#ffffff" stroke="#78869c"/><text x="34" y="264.4" fill="#1749bd" font-size="18" font-weight="700">Possible adjusted attempt</text><text x="34" y="292.59999999999997" fill="#172b4d" font-size="17" font-weight="400">Earlier input → your damage arrives while lethal → last hit.</text><text x="20" y="365.4" fill="#405574" font-size="17" font-weight="400">Event order only; spacing is not elapsed time. Earlier is useful</text><text x="20" y="389.2" fill="#405574" font-size="17" font-weight="400">only if the arriving hit can finish the minion.</text></g></svg>