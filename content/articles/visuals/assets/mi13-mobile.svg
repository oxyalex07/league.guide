<svg xmlns="http://www.w3.org/2000/svg" width="340" height="590" viewBox="0 0 340 590" role="img" aria-labelledby="title desc"><title id="title">Engaging</title><desc id="desc">Illustrative decision sequence; not to scale.</desc><rect width="100%" height="100%" fill="#f5f7fb"/><style>text{font-family:Arial,sans-serif;fill:#172b4d;font-size:16px}.label{fill:#1749bd;font-weight:bold}</style><text x="20" y="35" style="font-size:24px">Engaging</text><rect x="16" y="60" width="308" height="145" rx="8" fill="white" stroke="#dce2ed"/><text x="28" y="88" class="label">1 / REACH</text><text x="28" y="117">You → target across a wall</text><text x="28" y="140">Your reach is not team reach.</text><path d="M170 208v14m-5 -5l5 5 5 -5" stroke="#1749bd" stroke-width="2" fill="none"/><rect x="16" y="225" width="308" height="145" rx="8" fill="white" stroke="#dce2ed"/><text x="28" y="253" class="label">2 / FOLLOW</text><text x="28" y="282">Allies must walk around</text><text x="28" y="305">Check their route and tools.</text><path d="M170 373v14m-5 -5l5 5 5 -5" stroke="#1749bd" stroke-width="2" fill="none"/><rect x="16" y="390" width="308" height="145" rx="8" fill="white" stroke="#dce2ed"/><text x="28" y="418" class="label">3 / DECIDE</text><text x="28" y="447">Wait or commit together</text><text x="28" y="470">Cancel if support disappears.</text><text x="20" y="575">Illustrative · not to scale</text></svg>