<svg xmlns="http://www.w3.org/2000/svg" width="680" height="452" viewBox="0 0 680 452" role="img" aria-labelledby="title desc"><title id="title">MA02 — A changed threat changes recall</title><desc id="desc">With enough resources, a jungler visible elsewhere and a feasible crash, finish the crash then leave. When nearly dead and clearing would spend the escape tool while the jungler is missing, leave with an imperfect wave.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#1749bd"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#fff"/><path d="M0 8L8 0" stroke="#dce2ed"/></pattern></defs><rect width="100%" height="100%" fill="#f5f7fb"/><g font-family="Arial, sans-serif"><text x="20" y="28" fill="#172b4d" font-size="22" font-weight="700">A changed threat changes recall</text><text x="20" y="58.8" fill="#405574" font-size="17" font-weight="400">Hypothetical · not to scale</text><rect x="20" y="94.6" width="640" height="115.79999999999998" rx="9" fill="#ffffff" stroke="#78869c"/><text x="34" y="120.6" fill="#1749bd" font-size="18" font-weight="700">A · Crash is feasible</text><text x="34" y="148.79999999999998" fill="#172b4d" font-size="17" font-weight="400">Enough resources; jungler visible elsewhere. Finish the feasible</text><text x="34" y="172.59999999999997" fill="#172b4d" font-size="17" font-weight="400">crash, then leave. Remaining threats still matter.</text><rect x="20" y="238.39999999999998" width="640" height="115.80000000000001" rx="9" fill="#ffffff" stroke="#78869c"/><text x="34" y="264.4" fill="#1749bd" font-size="18" font-weight="700">B · Staying is too costly</text><text x="34" y="292.59999999999997" fill="#172b4d" font-size="17" font-weight="400">Nearly dead; clearing needs your escape tool; jungler missing.</text><text x="34" y="316.4" fill="#172b4d" font-size="17" font-weight="400">Leave with an imperfect wave.</text><text x="20" y="389.2" fill="#405574" font-size="17" font-weight="400">A crash brings your wave to the enemy turret. Improving the wave is</text><text x="20" y="413.0" fill="#405574" font-size="17" font-weight="400">conditional, not permission to stay or a free-return promise.</text></g></svg>