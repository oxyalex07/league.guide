<svg xmlns="http://www.w3.org/2000/svg" width="680" height="590" viewBox="0 0 680 590" role="img" aria-labelledby="title desc"><title id="title">Peeling</title><desc id="desc">Illustrative decision sequence; not to scale.</desc><rect width="100%" height="100%" fill="#f5f7fb"/><style>text{font-family:Arial,sans-serif;fill:#172b4d;font-size:16px}.label{fill:#1749bd;font-weight:bold}</style><text x="20" y="35" style="font-size:24px">Peeling</text><rect x="16" y="60" width="648" height="145" rx="8" fill="white" stroke="#dce2ed"/><text x="28" y="88" class="label">1 / IDENTIFY</text><text x="28" y="117">Side threat → vulnerable ally</text><text x="28" y="140">Watch the dangerous approach.</text><path d="M340 208v14m-5 -5l5 5 5 -5" stroke="#1749bd" stroke-width="2" fill="none"/><rect x="16" y="225" width="648" height="145" rx="8" fill="white" stroke="#dce2ed"/><text x="28" y="253" class="label">2 / DISRUPT</text><text x="28" y="282">Protector uses a ready tool</text><text x="28" y="305">Create space for the ally.</text><path d="M340 373v14m-5 -5l5 5 5 -5" stroke="#1749bd" stroke-width="2" fill="none"/><rect x="16" y="390" width="648" height="145" rx="8" fill="white" stroke="#dce2ed"/><text x="28" y="418" class="label">3 / FOLLOW</text><text x="28" y="447">Ally moves toward safety</text><text x="28" y="470">Stay able to answer next threat.</text><text x="20" y="575">Illustrative · not to scale</text></svg>