<svg xmlns="http://www.w3.org/2000/svg" width="340" height="571" viewBox="0 0 340 571" role="img" aria-labelledby="title desc"><title id="title">MI01 — Damage arrival decides</title><desc id="desc">In a late attempt, an allied shot kills the minion before the player&#x27;s projectile arrives. An earlier input can secure a last hit only if the arriving damage is lethal.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#1749bd"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#fff"/><path d="M0 8L8 0" stroke="#dce2ed"/></pattern></defs><rect width="100%" height="100%" fill="#f5f7fb"/><g font-family="Arial, sans-serif"><text x="20" y="28" fill="#172b4d" font-size="22" font-weight="700">Damage arrival decides</text><text x="20" y="58.8" fill="#405574" font-size="17" font-weight="400">Hypothetical · not to scale</text><rect x="20" y="94.6" width="300" height="163.4" rx="9" fill="#ffffff" stroke="#78869c"/><text x="34" y="120.6" fill="#1749bd" font-size="18" font-weight="700">Late attempt</text><text x="34" y="148.79999999999998" fill="#172b4d" font-size="17" font-weight="400">Your input → projectile</text><text x="34" y="172.59999999999997" fill="#172b4d" font-size="17" font-weight="400">travels → allied shot kills</text><text x="34" y="196.39999999999998" fill="#172b4d" font-size="17" font-weight="400">minion → your damage arrives</text><text x="34" y="220.2" fill="#172b4d" font-size="17" font-weight="400">too late.</text><rect x="20" y="286.0" width="300" height="139.60000000000002" rx="9" fill="#ffffff" stroke="#78869c"/><text x="34" y="312.0" fill="#1749bd" font-size="18" font-weight="700">Possible adjusted attempt</text><text x="34" y="340.2" fill="#172b4d" font-size="17" font-weight="400">Earlier input → your damage</text><text x="34" y="364.0" fill="#172b4d" font-size="17" font-weight="400">arrives while lethal → last</text><text x="34" y="387.8" fill="#172b4d" font-size="17" font-weight="400">hit.</text><text x="20" y="460.6" fill="#405574" font-size="17" font-weight="400">Event order only; spacing is not</text><text x="20" y="484.40000000000003" fill="#405574" font-size="17" font-weight="400">elapsed time. Earlier is useful</text><text x="20" y="508.20000000000005" fill="#405574" font-size="17" font-weight="400">only if the arriving hit can</text><text x="20" y="532.0" fill="#405574" font-size="17" font-weight="400">finish the minion.</text></g></svg>