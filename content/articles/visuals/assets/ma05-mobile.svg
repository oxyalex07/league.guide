<svg xmlns="http://www.w3.org/2000/svg" width="340" height="819" viewBox="0 0 340 819" role="img" aria-labelledby="title desc"><title id="title">MA05 — One route watched; one unknown</title><desc id="desc">An abstract watched approach and a second unknown approach converge toward a side wave. A ward answers only the first-route question; the player keeps an exit and plans to leave when a threat appears.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#1749bd"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#fff"/><path d="M0 8L8 0" stroke="#dce2ed"/></pattern></defs><rect width="100%" height="100%" fill="#f5f7fb"/><g font-family="Arial, sans-serif"><text x="20" y="28" fill="#172b4d" font-size="22" font-weight="700">One route watched; one</text><text x="20" y="58.8" fill="#172b4d" font-size="22" font-weight="700">unknown</text><text x="20" y="89.6" fill="#405574" font-size="17" font-weight="400">Hypothetical · not to scale</text><text x="20" y="125.39999999999999" fill="#1749bd" font-size="18" font-weight="700">Question: approach along this</text><text x="20" y="150.6" fill="#1749bd" font-size="18" font-weight="700">route?</text><path d="M65 190.79999999999998L170.0 275.79999999999995" fill="none" stroke="#1749bd" stroke-width="3"/><path d="M275 190.79999999999998L170.0 275.79999999999995" fill="none" stroke="#405574" stroke-width="3" stroke-dasharray="5 5"/><rect x="57" y="203.79999999999998" width="16" height="16" fill="white" stroke="#1749bd" stroke-width="3"/><circle cx="170.0" cy="283.79999999999995" r="10" fill="#1749bd"/><text x="20" y="175.79999999999998" font-size="17" fill="#172b4d">Watched</text><text x="218" y="175.79999999999998" font-size="17" fill="#172b4d">Unknown</text><rect x="20" y="318.79999999999995" width="300" height="187.20000000000005" rx="9" fill="#ffffff" stroke="#78869c"/><text x="34" y="344.79999999999995" fill="#1749bd" font-size="18" font-weight="700">Side wave · keep an exit</text><text x="34" y="372.99999999999994" fill="#172b4d" font-size="17" font-weight="400">Square: reachable observation</text><text x="34" y="396.79999999999995" fill="#172b4d" font-size="17" font-weight="400">point on one approach.</text><text x="34" y="420.59999999999997" fill="#172b4d" font-size="17" font-weight="400">Circle: player collecting.</text><text x="34" y="444.4" fill="#172b4d" font-size="17" font-weight="400">Dashed route: uncovered</text><text x="34" y="468.2" fill="#172b4d" font-size="17" font-weight="400">alternative.</text><rect x="20" y="534.0" width="300" height="139.5999999999999" rx="9" fill="#ffffff" stroke="#78869c"/><text x="34" y="560.0" fill="#1749bd" font-size="18" font-weight="700">Response</text><text x="34" y="588.2" fill="#172b4d" font-size="17" font-weight="400">Leave when a threat appears.</text><text x="34" y="612.0" fill="#172b4d" font-size="17" font-weight="400">Collect only as far as an</text><text x="34" y="635.8" fill="#172b4d" font-size="17" font-weight="400">acceptable retreat permits.</text><text x="20" y="708.5999999999999" fill="#405574" font-size="17" font-weight="400">Abstract branching paths, not</text><text x="20" y="732.3999999999999" fill="#405574" font-size="17" font-weight="400">map geography or a coverage</text><text x="20" y="756.1999999999998" fill="#405574" font-size="17" font-weight="400">radius. A useful warning leaves</text><text x="20" y="779.9999999999998" fill="#405574" font-size="17" font-weight="400">other routes unknown.</text></g></svg>