<svg xmlns="http://www.w3.org/2000/svg" width="340" height="590" viewBox="0 0 340 590" role="img" aria-labelledby="title desc"><title id="title">Map awareness</title><desc id="desc">Map awareness decision diagram: LOOK — Enemies, allies and the route back.. SEPARATE — Seen now, seen earlier, unknown.. ACT — Continue, shorten or retreat.</desc><rect width="100%" height="100%" fill="#f5f7fb"/><style>text{font-family:Arial,sans-serif;fill:#172b4d;font-size:16px}.label{fill:#1749bd;font-weight:bold}</style><text x="20" y="35" style="font-size:24px">Map awareness</text><rect x="16" y="60" width="308" height="145" rx="8" fill="white" stroke="#dce2ed"/><text x="28" y="88" class="label">1 / LOOK</text><text x="28" y="122">Enemies, allies and the route</text><text x="28" y="146">back.</text><path d="M170 208v14m-5 -5l5 5 5 -5" stroke="#1749bd" stroke-width="2" fill="none"/><rect x="16" y="225" width="308" height="145" rx="8" fill="white" stroke="#dce2ed"/><text x="28" y="253" class="label">2 / SEPARATE</text><text x="28" y="287">Seen now, seen earlier,</text><text x="28" y="311">unknown.</text><path d="M170 373v14m-5 -5l5 5 5 -5" stroke="#1749bd" stroke-width="2" fill="none"/><rect x="16" y="390" width="308" height="145" rx="8" fill="white" stroke="#dce2ed"/><text x="28" y="418" class="label">3 / ACT</text><text x="28" y="452">Continue, shorten or retreat.</text><text x="20" y="575">Illustrative · not to scale</text></svg>