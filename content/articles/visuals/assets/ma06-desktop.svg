<svg xmlns="http://www.w3.org/2000/svg" width="680" height="624" viewBox="0 0 680 624" role="img" aria-labelledby="title desc"><title id="title">MA06 — A sighting is not a route</title><desc id="desc">A solid observation says seen top now. A dashed inference suggests a likely area and an alternative. Without fresh evidence the location becomes unknown, shown with hatching. No hidden route is revealed.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#1749bd"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#fff"/><path d="M0 8L8 0" stroke="#dce2ed"/></pattern></defs><rect width="100%" height="100%" fill="#f5f7fb"/><g font-family="Arial, sans-serif"><text x="20" y="28" fill="#172b4d" font-size="22" font-weight="700">A sighting is not a route</text><text x="20" y="58.8" fill="#405574" font-size="17" font-weight="400">Hypothetical · not to scale</text><rect x="20" y="94.6" width="640" height="91.99999999999997" rx="9" fill="#ffffff" stroke="#78869c"/><text x="34" y="120.6" fill="#1749bd" font-size="18" font-weight="700">OBSERVED · solid border</text><text x="34" y="148.79999999999998" fill="#172b4d" font-size="17" font-weight="400">Seen top now. This records a sighting, not the next route.</text><path d="M340.0 209.59999999999997v15" stroke="#1749bd" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="240.59999999999997" width="640" height="115.80000000000001" rx="9" fill="#ffffff" stroke="#78869c" stroke-dasharray="7 5"/><text x="34" y="266.59999999999997" fill="#1749bd" font-size="18" font-weight="700">INFERRED · dashed border</text><text x="34" y="294.79999999999995" fill="#172b4d" font-size="17" font-weight="400">Likely area plus an alternative: the jungler may leave top</text><text x="34" y="318.59999999999997" fill="#172b4d" font-size="17" font-weight="400">quickly. Choose a brief action with an exit.</text><path d="M340.0 379.4v15" stroke="#1749bd" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="410.4" width="640" height="115.79999999999995" rx="9" fill="url(#hatch)" stroke="#78869c"/><text x="34" y="436.4" fill="#1749bd" font-size="18" font-weight="700">UNKNOWN · hatched fill</text><text x="34" y="464.59999999999997" fill="#172b4d" font-size="17" font-weight="400">No fresh sighting: stop relying on the old location. Shorten the</text><text x="34" y="488.4" fill="#172b4d" font-size="17" font-weight="400">next push.</text><text x="20" y="561.1999999999999" fill="#405574" font-size="17" font-weight="400">Qualitative sequence. No universal freshness timer, route,</text><text x="20" y="584.9999999999999" fill="#405574" font-size="17" font-weight="400">probability or mandatory clear.</text></g></svg>