<svg xmlns="http://www.w3.org/2000/svg" width="680" height="565" viewBox="0 0 680 565" role="img" aria-labelledby="title desc"><title id="title">Trading</title><desc id="desc">Hypothetical decision schematic. Distances are not game measurements.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#1749bd"/></marker></defs><rect width="100%" height="100%" fill="#f5f7fb"/><style>text{font-family:Arial,sans-serif;fill:#172b4d;font-size:17px}.label{font-weight:bold;fill:#1749bd}</style><text x="20" y="30" style="font-size:22px;font-weight:bold">Trading</text><rect x="20" y="55" width="640" height="140" rx="8" fill="#ffffff" stroke="#dce2ed"/><text x="32" y="83" class="label">1 / PURPOSE</text><text x="32" y="149">One affordable exchange</text><text x="32" y="176">Choose damage, space or farm.</text><rect x="20" y="210" width="640" height="140" rx="8" fill="#ffffff" stroke="#dce2ed"/><text x="32" y="238" class="label">2 / COST AND REPLY</text><text x="32" y="304">Your action → their response</text><text x="32" y="331">Count health, tools, lost farm.</text><rect x="20" y="365" width="640" height="140" rx="8" fill="#ffffff" stroke="#dce2ed"/><text x="32" y="393" class="label">3 / ENDPOINT</text><text x="32" y="459">Stop at your chosen exit</text><text x="32" y="486">Recheck before another attack.</text><text x="20" y="547">Hypothetical · not to scale</text></svg>