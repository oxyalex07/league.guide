<svg xmlns="http://www.w3.org/2000/svg" width="680" height="590" viewBox="0 0 680 590" role="img" aria-labelledby="title desc"><title id="title">Disengaging</title><desc id="desc">Decision diagram for disengaging: SIGNAL — Choose a shared exit. COVER — Delay pursuit with a tool. LEAVE — Do not reopen the fight.</desc><rect width="100%" height="100%" fill="#f5f7fb"/><style>text{font-family:Arial,sans-serif;fill:#172b4d;font-size:16px}.label{fill:#1749bd;font-weight:bold}</style><text x="20" y="35" style="font-size:24px">Disengaging</text><rect x="16" y="60" width="648" height="145" rx="8" fill="white" stroke="#dce2ed"/><text x="28" y="88" class="label">1 / SIGNAL</text><text x="28" y="122">Choose a shared exit</text><path d="M340 208v14m-5 -5l5 5 5 -5" stroke="#1749bd" stroke-width="2" fill="none"/><rect x="16" y="225" width="648" height="145" rx="8" fill="white" stroke="#dce2ed"/><text x="28" y="253" class="label">2 / COVER</text><text x="28" y="287">Delay pursuit with a tool</text><path d="M340 373v14m-5 -5l5 5 5 -5" stroke="#1749bd" stroke-width="2" fill="none"/><rect x="16" y="390" width="648" height="145" rx="8" fill="white" stroke="#dce2ed"/><text x="28" y="418" class="label">3 / LEAVE</text><text x="28" y="452">Do not reopen the fight</text><text x="20" y="575">Illustrative · not to scale</text></svg>