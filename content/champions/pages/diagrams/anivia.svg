<svg class="champion-diagram" viewBox="0 0 460 300" role="img" aria-labelledby="special-title-anivia special-desc-anivia" xmlns="http://www.w3.org/2000/svg"><style>:root{--ink:#182a40;--blue:#224fc5;--foe:#ad3932;--muted:#536477;--surface:#fff;--tint:#f0f4fc;--line:#d9e0e9;color:var(--ink)}text{fill:var(--ink);font:24px system-ui,sans-serif}@media(prefers-color-scheme:dark){:root{--ink:#ededed;--blue:#9abaff;--foe:#ed9b91;--muted:#b5b5b5;--surface:#191919;--tint:#222;--line:#424242}}</style><title id="special-title-anivia">Anivia: kit positioning</title><desc id="special-desc-anivia">Use the wall to divide enemy movement while leaving allies an exit. Place the storm where opponents must cross or remain; a wall behind your own team can remove their retreat.</desc><defs><marker id="special-anivia" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="currentColor"/></marker></defs><rect x="1" y="1" width="458" height="298" rx="12" fill="var(--tint)" stroke="var(--line)"/><circle cx="65" cy="200" r="18" fill="var(--blue)"/><text x="65" y="245" text-anchor="middle">You</text><circle cx="150" cy="140" r="18" fill="var(--blue)"/><text x="150" y="185" text-anchor="middle">Ally</text><rect x="323" y="113" width="34" height="34" fill="var(--foe)"/><text x="340" y="175" text-anchor="middle">Enemy</text><circle cx="325" cy="130" r="70" fill="none" stroke="var(--muted)" stroke-dasharray="5 5"/><text x="325" y="48" text-anchor="middle">Storm</text><rect x="240" y="50" width="20" height="120" fill="var(--muted)"/><path d="M160,220 L65,250" fill="none" stroke="currentColor" stroke-width="3" marker-end="url(#special-anivia)"/><text x="310" y="260" text-anchor="middle">Leave an exit</text></svg>