<svg class="champion-diagram" viewBox="0 0 460 300" role="img" aria-labelledby="special-title-yone special-desc-yone" xmlns="http://www.w3.org/2000/svg"><style>:root{--ink:#182a40;--blue:#224fc5;--foe:#ad3932;--muted:#536477;--surface:#fff;--tint:#f0f4fc;--line:#d9e0e9;color:var(--ink)}text{fill:var(--ink);font:24px system-ui,sans-serif}@media(prefers-color-scheme:dark){:root{--ink:#ededed;--blue:#9abaff;--foe:#ed9b91;--muted:#b5b5b5;--surface:#191919;--tint:#222;--line:#424242}}</style><title id="special-title-yone">Yone: kit positioning</title><desc id="special-desc-yone">Soul Unbound leaves a fixed return point. The outward path can threaten an enemy, but the return goes back to the body. Start from a place enemies cannot easily occupy.</desc><defs><marker id="special-yone" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="currentColor"/></marker></defs><rect x="1" y="1" width="458" height="298" rx="12" fill="var(--tint)" stroke="var(--line)"/><circle cx="65" cy="190" r="18" fill="var(--blue)"/><text x="65" y="235" text-anchor="middle">Body</text><circle cx="280" cy="110" r="18" fill="var(--blue)"/><text x="280" y="155" text-anchor="middle">Spirit</text><rect x="373" y="143" width="34" height="34" fill="var(--foe)"/><text x="390" y="205" text-anchor="middle">Enemy</text><path d="M90,180 L250,120" fill="none" stroke="currentColor" stroke-width="3" marker-end="url(#special-yone)"/><path d="M250,150 L90,220" fill="none" stroke="currentColor" stroke-width="3" marker-end="url(#special-yone)"/><text x="220" y="270" text-anchor="middle">Check both positions</text></svg>