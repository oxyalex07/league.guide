<svg class="champion-diagram" viewBox="0 0 460 300" role="img" aria-labelledby="special-title-gnar special-desc-gnar" xmlns="http://www.w3.org/2000/svg"><style>:root{--ink:#182a40;--blue:#224fc5;--foe:#ad3932;--muted:#536477;--surface:#fff;--tint:#f0f4fc;--line:#d9e0e9;color:var(--ink)}text{fill:var(--ink);font:24px system-ui,sans-serif}@media(prefers-color-scheme:dark){:root{--ink:#ededed;--blue:#9abaff;--foe:#ed9b91;--muted:#b5b5b5;--surface:#191919;--tint:#222;--line:#424242}}</style><title id="special-title-gnar">Gnar: kit positioning</title><desc id="special-desc-gnar">In Mega form, choose a slam direction that sends an enemy into terrain. A target beside a wall is different from a target with open ground behind them. Check rage and ally follow-up first.</desc><defs><marker id="special-gnar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="currentColor"/></marker></defs><rect x="1" y="1" width="458" height="298" rx="12" fill="var(--tint)" stroke="var(--line)"/><rect x="390" y="40" width="35" height="195" fill="var(--muted)"/><text x="385" y="270" text-anchor="middle">Wall</text><circle cx="120" cy="160" r="18" fill="var(--blue)"/><text x="120" y="205" text-anchor="middle">Mega Gnar</text><rect x="268" y="143" width="34" height="34" fill="var(--foe)"/><text x="285" y="205" text-anchor="middle">Enemy</text><path d="M150,155 L365,155" fill="none" stroke="currentColor" stroke-width="3" marker-end="url(#special-gnar)"/></svg>