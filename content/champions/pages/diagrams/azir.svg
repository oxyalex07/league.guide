<svg class="champion-diagram" viewBox="0 0 460 300" role="img" aria-labelledby="special-title-azir special-desc-azir" xmlns="http://www.w3.org/2000/svg"><style>:root{--ink:#182a40;--blue:#224fc5;--foe:#ad3932;--muted:#536477;--surface:#fff;--tint:#f0f4fc;--line:#d9e0e9;color:var(--ink)}text{fill:var(--ink);font:24px system-ui,sans-serif}@media(prefers-color-scheme:dark){:root{--ink:#ededed;--blue:#9abaff;--foe:#ed9b91;--muted:#b5b5b5;--surface:#191919;--tint:#222;--line:#424242}}</style><title id="special-title-azir">Azir: kit positioning</title><desc id="special-desc-azir">Soldiers threaten their nearby attack area while Azir stands farther back. Keep a useful soldier position for damage and retreat; moving every soldier forward can remove your safe zone.</desc><defs><marker id="special-azir" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="currentColor"/></marker></defs><rect x="1" y="1" width="458" height="298" rx="12" fill="var(--tint)" stroke="var(--line)"/><circle cx="65" cy="190" r="18" fill="var(--blue)"/><text x="65" y="235" text-anchor="middle">Azir</text><rect x="333" y="133" width="34" height="34" fill="var(--foe)"/><text x="350" y="195" text-anchor="middle">Enemy</text><circle cx="280" cy="145" r="62" fill="none" stroke="var(--muted)" stroke-dasharray="5 5"/><text x="280" y="71" text-anchor="middle">Soldier zone</text><path d="M280,120 l18,30 h-36 Z" fill="var(--blue)"/><path d="M90,185 L250,150" fill="none" stroke="currentColor" stroke-width="3" marker-end="url(#special-azir)"/></svg>