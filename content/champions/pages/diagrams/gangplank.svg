<svg class="champion-diagram" viewBox="0 0 460 300" role="img" aria-labelledby="special-title-gangplank special-desc-gangplank" xmlns="http://www.w3.org/2000/svg"><style>:root{--ink:#182a40;--blue:#224fc5;--foe:#ad3932;--muted:#536477;--surface:#fff;--tint:#f0f4fc;--line:#d9e0e9;color:var(--ink)}text{fill:var(--ink);font:24px system-ui,sans-serif}@media(prefers-color-scheme:dark){:root{--ink:#ededed;--blue:#9abaff;--foe:#ed9b91;--muted:#b5b5b5;--surface:#191919;--tint:#222;--line:#424242}}</style><title id="special-title-gangplank">Gangplank: kit positioning</title><desc id="special-desc-gangplank">Start with a barrel your team can protect, then connect pressure toward the enemy. The circles illustrate a chain, not the exact link distance. Enemies can contest the trigger barrel.</desc><defs><marker id="special-gangplank" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="currentColor"/></marker></defs><rect x="1" y="1" width="458" height="298" rx="12" fill="var(--tint)" stroke="var(--line)"/><circle cx="55" cy="190" r="18" fill="var(--blue)"/><text x="55" y="235" text-anchor="middle">You</text><rect x="378" y="158" width="34" height="34" fill="var(--foe)"/><text x="395" y="220" text-anchor="middle">Enemy</text><circle cx="150" cy="125" r="53" fill="none" stroke="var(--muted)" stroke-dasharray="5 5"/><text x="150" y="60" text-anchor="middle"></text><rect x="140" y="115" width="20" height="20" fill="var(--blue)"/><circle cx="250" cy="125" r="53" fill="none" stroke="var(--muted)" stroke-dasharray="5 5"/><text x="250" y="60" text-anchor="middle"></text><rect x="240" y="115" width="20" height="20" fill="var(--blue)"/><circle cx="350" cy="125" r="53" fill="none" stroke="var(--muted)" stroke-dasharray="5 5"/><text x="350" y="60" text-anchor="middle"></text><rect x="340" y="115" width="20" height="20" fill="var(--blue)"/><path d="M85,180 L140,135" fill="none" stroke="currentColor" stroke-width="3" marker-end="url(#special-gangplank)"/><text x="230" y="260" text-anchor="middle">Protect the first barrel</text></svg>