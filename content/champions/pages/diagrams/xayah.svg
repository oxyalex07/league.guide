<svg class="champion-diagram" viewBox="0 0 460 300" role="img" aria-labelledby="special-title-xayah special-desc-xayah" xmlns="http://www.w3.org/2000/svg"><style>:root{--ink:#182a40;--blue:#224fc5;--foe:#ad3932;--muted:#536477;--surface:#fff;--tint:#f0f4fc;--line:#d9e0e9;color:var(--ink)}text{fill:var(--ink);font:24px system-ui,sans-serif}@media(prefers-color-scheme:dark){:root{--ink:#ededed;--blue:#9abaff;--foe:#ed9b91;--muted:#b5b5b5;--surface:#191919;--tint:#222;--line:#424242}}</style><title id="special-title-xayah">Xayah: kit positioning</title><desc id="special-desc-xayah">Feathers return toward Xayah. Move so the target lies across several return lines before using Bladecaller; feathers beyond the target are useful only if their paths cross it.</desc><defs><marker id="special-xayah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="currentColor"/></marker></defs><rect x="1" y="1" width="458" height="298" rx="12" fill="var(--tint)" stroke="var(--line)"/><circle cx="70" cy="190" r="18" fill="var(--blue)"/><text x="70" y="235" text-anchor="middle">Xayah</text><rect x="243" y="138" width="34" height="34" fill="var(--foe)"/><text x="260" y="200" text-anchor="middle">Target</text><path d="M400,93 l10,12 -10,12 -10,-12 Z" fill="var(--foe)"/><path d="M390,105 L90,190" fill="none" stroke="currentColor" stroke-width="3" marker-end="url(#special-xayah)"/><path d="M400,118 l10,12 -10,12 -10,-12 Z" fill="var(--foe)"/><path d="M390,130 L90,190" fill="none" stroke="currentColor" stroke-width="3" marker-end="url(#special-xayah)"/><path d="M400,143 l10,12 -10,12 -10,-12 Z" fill="var(--foe)"/><path d="M390,155 L90,190" fill="none" stroke="currentColor" stroke-width="3" marker-end="url(#special-xayah)"/><text x="385" y="250" text-anchor="middle">Feathers</text></svg>