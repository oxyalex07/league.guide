<svg class="champion-diagram" viewBox="0 0 460 300" role="img" aria-labelledby="special-title-zed special-desc-zed" xmlns="http://www.w3.org/2000/svg"><style>:root{--ink:#182a40;--blue:#224fc5;--foe:#ad3932;--muted:#536477;--surface:#fff;--tint:#f0f4fc;--line:#d9e0e9;color:var(--ink)}text{fill:var(--ink);font:24px system-ui,sans-serif}@media(prefers-color-scheme:dark){:root{--ink:#ededed;--blue:#9abaff;--foe:#ed9b91;--muted:#b5b5b5;--surface:#191919;--tint:#222;--line:#424242}}</style><title id="special-title-zed">Zed: kit positioning</title><desc id="special-desc-zed">A shadow creates another firing angle and a possible swap location. Keep the return position useful: the same visible location that enables your escape can also be watched by enemies.</desc><defs><marker id="special-zed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="currentColor"/></marker></defs><rect x="1" y="1" width="458" height="298" rx="12" fill="var(--tint)" stroke="var(--line)"/><circle cx="65" cy="190" r="18" fill="var(--blue)"/><text x="65" y="235" text-anchor="middle">Shadow</text><circle cx="250" cy="100" r="18" fill="var(--blue)"/><text x="250" y="145" text-anchor="middle">Zed</text><rect x="368" y="153" width="34" height="34" fill="var(--foe)"/><text x="385" y="215" text-anchor="middle">Enemy</text><path d="M90,188 L355,175" fill="none" stroke="currentColor" stroke-width="3" marker-end="url(#special-zed)"/><path d="M275,110 L360,155" fill="none" stroke="currentColor" stroke-width="3" marker-end="url(#special-zed)"/><text x="230" y="270" text-anchor="middle">Do not abandon the exit</text></svg>